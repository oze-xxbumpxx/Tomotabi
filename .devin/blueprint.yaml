# Devin environment blueprint — https://docs.devin.ai/onboard-devin/environment/blueprint-reference
# 作業手順とルールは AGENTS.md と .agents/skills/devin-workflow/SKILL.md。背景は docs/devin-setup.md。

# Node 22.x に揃える（.nvmrc / package.json の engines と同じ）。ベースイメージの Node は 22 と限らない。
# 22 が無ければ nodejs.org の公式配布物をチェックサムで確かめて入れる。最後に 22 でなければ失敗させる。
initialize: |
  set -eu
  if ! node --version 2>/dev/null | grep -q '^v22\.'; then
    case "$(uname -m)" in
      x86_64) arch=x64 ;;
      aarch64 | arm64) arch=arm64 ;;
      *) echo "未対応の CPU: $(uname -m)" >&2; exit 1 ;;
    esac
    base=https://nodejs.org/dist/latest-v22.x
    tmp=$(mktemp -d)
    curl -fsSL -o "$tmp/SHASUMS256.txt" "$base/SHASUMS256.txt"
    file=$(grep -o "node-v22\.[0-9.]*-linux-$arch\.tar\.xz" "$tmp/SHASUMS256.txt" | head -n 1)
    curl -fsSL -o "$tmp/$file" "$base/$file"
    (cd "$tmp" && grep " $file\$" SHASUMS256.txt | sha256sum --check --strict -)
    mkdir -p "$HOME/.local/node22"
    tar -xJf "$tmp/$file" -C "$HOME/.local/node22" --strip-components=1
    export PATH="$HOME/.local/node22/bin:$PATH"
    if [ -n "${ENVRC:-}" ]; then echo "PATH=$PATH" >> "$ENVRC"; fi
  fi
  node --version | grep -q '^v22\.' || { echo "Node 22 が必要です: $(node --version)" >&2; exit 1; }

# lockfile どおりに入れる。CI（.github/workflows/ci.yml）と同じ。Node 22 以外では入れない。
maintenance: |
  node --version | grep -q '^v22\.' || { echo "Node 22 が必要です: $(node --version)" >&2; exit 1; }
  npm ci

knowledge:
  - name: lint
    contents: |
      npm run lint                  # ESLint（リポジトリ全体）
  - name: type-check
    contents: |
      npm run type-check            # packages/contracts を build してから全 workspace を型チェック
  - name: test
    contents: |
      npm test                      # web / api の単体・HTTP テスト。DB は使わない
      npm run test:api-db           # Testcontainers で実 PostgreSQL。Docker が必要。動かなければ CI の api-db ジョブに任せ、PR に「未確認」と書く
      npm run test:harness          # .claude/ か .agents/ を変えたときだけ。CI では実行されない
  - name: build
    contents: |
      npm run build                 # contracts → api → web の順
  - name: contract-and-schema
    contents: |
      npm run api:check             # API 契約を変えたとき。OpenAPI から web のクライアントを再生成し、差分が無いこと
      npm run db:check              # DB スキーマを変えたとき。migration の生成漏れが無いこと
  - name: dev
    contents: |
      npm run dev:api               # http://localhost:3001。DATABASE_URL が空なら in-memory
      npm run dev:web               # http://localhost:3000。/api を 3001 へ転送
      # dev:api には PUBLIC_APP_ORIGIN=http://localhost:3000 を付ける。無いと /api/auth/* の POST が OriginGuard で 403 になる（DATABASE_URL 未設定時の 503 とは別物）。
  - name: notes
    contents: |
      .env は .env.example を元に作るが、DATABASE_URL は空のままでよい。本番の値や秘密情報を書かない。
      .claude/scripts/run-quality-gates.sh はロックファイルから npm を検出して実行できる。既定では休眠中の試験を除く。ハーネスの全件は `npm run test:harness`。
      migration の適用（npm run db:migrate）は管理者だけ。Devin は実行しない。
