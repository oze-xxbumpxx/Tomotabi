name: delegation-control

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [initialize, reconcile, review-refresh]
        default: reconcile
      pr:
        type: string
        required: false
  schedule:
    - cron: '0 * * * *'
  workflow_run:
    workflows: [delegation-events, ci, e2e]
    types: [completed]

concurrency:
  group: tomotabi-delegation-control
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: write
  actions: read

jobs:
  control:
    name: delegation-control-writer
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Process public requests and refresh reviews
        run: node .claude/scripts/delegation-control.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_NAMESPACE: tomotabi-harness
