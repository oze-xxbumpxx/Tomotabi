name: delegation-events

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: delegation-event-notification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write notification data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request?.number;
            if (!Number.isSafeInteger(pr) || pr <= 0) {
              core.setFailed('PR correspondence is unavailable');
              return;
            }
            const notice = { schema_version: 1, repository_id: context.payload.repository.id, pr, event: context.eventName, run_id: Number(process.env.GITHUB_RUN_ID) };
            fs.mkdirSync('delegation-notification', { recursive: true });
            fs.writeFileSync('delegation-notification/notification.json', JSON.stringify(notice));
      - uses: actions/upload-artifact@v4
        with:
          name: delegation-notification
          path: delegation-notification/notification.json
          if-no-files-found: error
          retention-days: 2
