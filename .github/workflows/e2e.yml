name: e2e

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/contracts/**"
      - "e2e/**"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/contracts/**"
      - "e2e/**"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # web の build には E2E 用の API_ORIGIN が要る（rewrites の転送先は
      # build 時に決まる。e2e/support/env.ts の固定ポートと同じ値）。
      - run: npm run build -w @tomotabi/contracts
      - run: npm run build -w @tomotabi/api
      - run: npm run build -w @tomotabi/web
        env:
          API_ORIGIN: http://localhost:3101
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
