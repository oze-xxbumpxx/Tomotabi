# Local development database only. Never point production settings at this file.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: tomotabi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
      LOCAL_MIGRATOR_PASSWORD: ${LOCAL_MIGRATOR_PASSWORD:-migrator}
      LOCAL_APP_RUNTIME_PASSWORD: ${LOCAL_APP_RUNTIME_PASSWORD:-app_runtime}
    volumes:
      - tomotabi-db:/var/lib/postgresql/data
      - ./apps/api/db/admin/create-roles.sql:/tomotabi/create-roles.sql:ro
      - ./apps/api/db/admin/grant-database.sql:/tomotabi/grant-database.sql:ro
      - ./apps/api/db/admin/init-local.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    # Checked over TCP: during first-start initialization the entrypoint runs a temporary server
    # that listens only on the Unix socket, so `docker compose up --wait` returns only after
    # roles exist and the real server accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  tomotabi-db:
