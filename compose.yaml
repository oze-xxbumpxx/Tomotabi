# Local development database only. Never point production settings at this file.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: tomotabi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
      LOCAL_MIGRATOR_PASSWORD: ${LOCAL_MIGRATOR_PASSWORD:-migrator}
      LOCAL_APP_RUNTIME_PASSWORD: ${LOCAL_APP_RUNTIME_PASSWORD:-app_runtime}
    volumes:
      - tomotabi-db:/var/lib/postgresql/data
      - ./apps/api/db/admin/create-roles.sql:/tomotabi/create-roles.sql:ro
      - ./apps/api/db/admin/init-local.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro

volumes:
  tomotabi-db:
